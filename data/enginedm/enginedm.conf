# Example /etc/enginedm/enginedm.conf
# Plain key=value lines; '#' starts a comment. Copy it with:
#   sudo install -Dm640 data/enginedm/enginedm.conf /etc/enginedm/enginedm.conf
# (install.sh does NOT overwrite your config with this file.)
# Booleans are only "true" when written exactly as `true`; anything else counts as false.
# Values shown are the defaults unless a line says otherwise.

# GTK theme applied at start (a directory name listed in unidata.scrub). If it is not found,
# the first theme found is used.
theme=Adwaita-dark

tiling=true

# Session pre-selected on the login screen (name of the .desktop entry, case-insensitive,
# e.g. Hyprland, sway). Also the interface name when `interface=` is not set.
default_session=Hyprland

# Interface directory to load (contains main.html and style.css). Searched in
# $EDM_INTERFACE_DIR, /etc/enginedm/interfaces, /usr/local/share/enginedm/interfaces and
# /usr/share/enginedm/interfaces. If it is missing or broken, the built-in Hyproman is used.
interface=Hyproman

# PAM service (/etc/pam.d/<name>), used in standalone mode only; greetd uses its own.
# Use `enginedm` on OpenRC/elogind or systemd systems so the logind session is created
# (install.sh installs /etc/pam.d/enginedm). The default is system-login.
pam_service=enginedm

# Background image: absolute path, or relative to the interface directory.
# png/jpg/webp/gif, max 32 MiB. Read at startup and embedded as a data: URI.
#wallpaper=/usr/share/backgrounds/enginedm.png

# The picture you pick in the inspector (eye button, top right) is remembered by writing its path
# into the `wallpaper=` line above (the active line, else the commented example, else a new line
# is added; the rest of this file is left as it is). No copy is made. Writing the config needs
# root; an unprivileged greeter keeps the background for the session but cannot save it.

# Folders the picture inspector indexes. One `Label=/absolute/path` per line:
#   Label=/dir/*   the folder and every folder below it
#   Label=/dir     only the pictures directly in that folder (no sub-folders)
# The label (Pictures, Walls, ...) is only a name; the inspector shows how many pictures and how
# many bytes each label indexed. `$HOME`, `${HOME}` and a leading `~` are expanded, but the result
# must be a real absolute path (no `..`, not `/`). Under greetd/greeter $HOME is the greeter user's,
# so prefer full paths there. `#` starts a comment. The spelling `Pictures://home/me/Pictures/*` is
# accepted too. Without this block the inspector scans `$HOME/Pictures/*` (or $EDM_PICTURES_DIR).
#user_dirs {
#    Pictures=/home/me/Pictures/*
#    Walls=/usr/share/backgrounds
#    Photos=$HOME/Photos/2026
#}

# Personal settings (more keys will come). One `key=value` per line, `#` starts a comment.
#   filter=  pictures the inspector lists while its search box is empty, in this order. Separate
#            paths with spaces ("double quotes" around a path that contains spaces). Absolute,
#            `~` / `$HOME`-relative, or relative to the user_dirs folders (then $HOME). Anything
#            found by typing in the search box is still available. Without `filter=` the list
#            stays empty until you search. Up to 500 entries; a missing file is reported and skipped.
#   filter_known=  how many pictures that empty-box list shows. With `filter=` it keeps only the
#            first N of those entries; without `filter=` (or when none of its files exist) it lists
#            the first N pictures alphabetically. Unset: every `filter=` entry, or nothing when
#            there is no `filter=`. Max 500; 0 = nothing.
#user_settings {
#    filter=Pictures/a.png ~/walls/b.jpg "/home/me/my walls/c.webp"
#    filter_known=20
#}

# Start sessions under `dbus-run-session -- <Exec>` on non-systemd systems. Set to false when
# your session command is a wrapper script that already starts a session bus.
dbus_wrap=true

# Kept for compatibility. NOTE: when the key is missing the program assumes true.
# Cannot be true together with systemctl_usedefine.
autologin=false

# Two-factor login. Method is `totp` or `hotp`; the secret is required when enabled.
# With 2FA enabled but no method/secret, every login is refused with a clear message.
# This file then contains a secret: keep it 0640 root:greeter (or 0600 root:root in
# standalone mode). HOTP counter: /var/lib/enginedm/hotp_counter; a new secret restarts it at 0.
two_factor_enabled=false
#two_factor_method=totp
#two_factor_secret=CHANGE_ME_BASE32_SECRET

# Cannot be true together with autologin.
#systemctl_usedefine=true
