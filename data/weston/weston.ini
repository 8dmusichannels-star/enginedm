# Weston config for the EngineDM greeter (kiosk use). Installed to /etc/enginedm/weston.ini.
# Weston runs the greeter as its only client (see /usr/libexec/enginedm-weston). The kiosk shell
# makes every toplevel window fullscreen on the output, so no bars, panels or window management.
# Needs Weston with kiosk-shell (Weston 10 or newer is recommended).

[core]
shell=kiosk-shell.so
# No screen blanking on the login screen.
idle-time=0
# Start even when no keyboard/mouse is detected yet (USB devices may appear late).
require-input=false

# Deliberately no [keyboard] / [shell] key bindings and no [launcher] entries: there must be no
# way to start a terminal or leave the greeter from the login screen. VT switching
# (Ctrl+Alt+Fn) is handled by Weston itself.

